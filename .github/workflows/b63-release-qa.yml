name: GoalVdLine B63 release QA
on:
  push:
    branches:
      - feature/b63-home-three-engine-rates
      - feature/b64-sports-reading
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goalvdline-b63-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Node backend syntax
        run: |
          node --check backend/server.js
          node --check backend/auto_coupon/background_worker.js
      # B64: test completo di API, elaborazione remota, sicurezza owner,
      # notifiche, Neon e scheduler con dati mock/temporanei.
      # Non avvia servizi Render e non usa segreti di produzione.
      - name: Full backend Node regression
        run: |
          npm --prefix backend ci --no-audit --no-fund
          npm --prefix backend test

      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Dependencies
        run: flutter pub get
      - name: Flutter static analysis
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Full Flutter regression
        run: flutter test --no-pub --reporter compact
      - name: Targeted B63 smoke tests
        run: |
          flutter test --no-pub --reporter compact \
            test/services/goalvdline_third_brain_service_test.dart \
            test/widgets/goalvdline_three_brains_expansion_test.dart \
            test/widgets/goalvdline_b63_catalog_competitions_test.dart \
            test/services/italian_bookmaker_market_filter_test.dart \
            test/services/goalvdline_daily_match_counter_test.dart \
            test/services/goalvdline_market_relation_service_test.dart \
            test/services/dual_engine_summary_preview_test.dart
