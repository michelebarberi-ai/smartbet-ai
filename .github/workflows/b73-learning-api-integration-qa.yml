name: B73 learning API integration QA (free Render service)

on:
  push:
    branches: [feature/b73-learning-api-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b73-learning-api-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-safe-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies without audit network calls
        run: npm --prefix backend ci --no-audit --no-fund
      - name: Backend Node syntax checks
        run: |
          node --check backend/learning/learning_routes.js
          node --check backend/learning/learning_repository.js
          node --check backend/learning/learning_service.js
          for f in backend/daily_palinsesto/*.js; do node --check "$f"; done
      - name: Complete backend regression
        run: npm --prefix backend test
