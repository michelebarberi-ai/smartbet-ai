name: B73 daily palinsesto push delivery QA

on:
  push:
    branches: [feature/b73-daily-palinsesto-push-delivery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goalvdline-b73-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Full backend regression and B73 push validation
        run: |
          npm --prefix backend ci --no-audit --no-fund
          npm --prefix backend test
      - name: Flutter setup
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Flutter dependencies
        run: flutter pub get
      - name: Flutter analysis
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Full Flutter tests
        run: flutter test --no-pub --reporter compact
      - name: Inspect App Store signing profile for APNs capability (no upload)
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "Profile secret not connected to this QA workflow."
          else
            printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/GoalVdLine.mobileprovision"
            if openssl cms -verify -inform DER -noverify \
                -in "$RUNNER_TEMP/GoalVdLine.mobileprovision" \
                -out "$RUNNER_TEMP/GoalVdLine.plist" 2>/dev/null; then
              python3 - <<'PY'
import os, plistlib
with open(os.environ['RUNNER_TEMP']+'/GoalVdLine.plist','rb') as f:
    p=plistlib.load(f)
value=p.get('Entitlements',{}).get('aps-environment')
print('Profile APNs production capability:', value=='production')
PY
            else
              echo "Profile format could not be inspected on Linux; no signing changes made."
            fi
          fi
      - name: Inspect live Render readiness (safe boolean fields only)
        run: |
          curl --fail --silent --show-error --max-time 45 --retry 2 \
            https://goalvdline-learning-api.onrender.com/learning/v1/status \
            | node -e "let x='';process.stdin.on('data',d=>x+=d);process.stdin.on('end',()=>{let j=JSON.parse(x);if(j.service!=='SmartBet Central Learning')process.exit(2);console.log(JSON.stringify({registrationReady:j.dailyPalinsestoRegistrationEnabled,pushReady:j.dailyPalinsestoPushEnabled}));})"
