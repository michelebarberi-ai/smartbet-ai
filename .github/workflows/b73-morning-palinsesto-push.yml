name: Daily palinsesto digest APNs (opt-in only)

on:
  # GitHub uses UTC. Running hourly across 05:05..10:05 UTC covers 08:00
  # Europe/Rome in both CET and CEST, plus user-selected morning times.
  # Per-client/day claims in Neon prevent repeat notifications.
  # Scheduled workflows only run when this file is on the default branch.
  schedule:
    - cron: '5 5-10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-palinsesto-push
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.repository == 'michelebarberi-ai/smartbet-ai' }}
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch subscribed calendar summary (never betting coupons)
        env:
          DAILY_PALINSESTO_DISPATCH_URL: ${{ secrets.DAILY_PALINSESTO_DISPATCH_URL }}
          DAILY_PALINSESTO_WORKER_TOKEN: ${{ secrets.DAILY_PALINSESTO_WORKER_TOKEN }}
        run: |
          node backend/daily_palinsesto/trigger_dispatch.js
