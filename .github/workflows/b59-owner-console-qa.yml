name: GoalVdLine B59 combined owner login + public release QA

# No TestFlight upload from this feature branch.
on:
  push:
    branches:
      - feature/b59-owner-console-release-prep

concurrency:
  group: b59-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-b59:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Dependencies
        run: flutter pub get
      - name: Dart analyzer
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Owner login and public-learning widget tests
        run: |
          flutter test --no-pub --reporter compact \
            test/services/goalvdline_owner_session_client_test.dart \
            test/services/goalvdline_b57_public_private_consensus_test.dart \
            test/services/quotelab_historical_service_test.dart
      - name: Complete Flutter regression
        run: flutter test --no-pub --reporter compact

  backend-b59:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Backend regression
        working-directory: backend
        run: npm test
