name: GoalVdLine B65 global bookmakers QA
# Read-only CI: no TestFlight upload, paid services or production secrets.
on:
  push:
    branches:
      - fix/b65-global-bookmakers-coupon-clarity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goalvdline-b65-global-odds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Backend syntax
        run: |
          node --check backend/server.js
          node --check backend/auto_coupon/background_worker.js
      - name: Backend regression
        run: |
          npm --prefix backend ci --no-audit --no-fund
          npm --prefix backend test
      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Flutter dependencies
        run: flutter pub get
      - name: Flutter static analysis
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Flutter full regression
        run: flutter test --no-pub --reporter compact
      - name: Specific market and bookmaker tests
        run: |
          flutter test --no-pub --reporter compact \
            test/services/goalvdline_quote_policy_test.dart \
            test/services/goalvdline_multi_bookmaker_odds_test.dart \
            test/services/smartbet_or_markets_test.dart \
            test/services/goalvdline_market_probability_filter_test.dart
