name: B61 one-time Resend owner email verification

on:
  push:
    branches:
      - release/b61-testflight

permissions:
  contents: read

jobs:
  owner-email-smoke:
    if: github.event.head_commit.message == 'test(b61): verify Resend owner email'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request a single owner activation message (no secret output)
        shell: bash
        run: |
          set -euo pipefail
          url='https://goalvdline-learning-api.onrender.com/owner/v1/setup/request'
          status="$(curl -sS -X POST --max-time 65 --connect-timeout 10 \
            -H 'Content-Type: application/json' \
            --data '{}' \
            -o /dev/null -w '%{http_code}' "$url")"
          echo "Resend activation mail request HTTP $status"
          test "$status" = '202'
