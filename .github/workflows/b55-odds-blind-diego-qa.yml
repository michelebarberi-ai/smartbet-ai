name: GoalVdLine B55 odds-blind Diego QA

# Experimental branch only: does not sign, deploy, or publish TestFlight.
on:
  push:
    branches:
      - fix/b55-odds-blind-diego

permissions:
  contents: read

jobs:
  b55:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Odds-blind regression
        run: |
          flutter test --no-pub --reporter compact test/services/diego_ai_odds_blind_test.dart
          flutter test --no-pub --reporter compact test/services/dual_engine_sports_comparison_test.dart
          flutter test --no-pub --reporter compact test/services/smartbet_sports_market_selector_test.dart
      - name: Full regression
        run: flutter test --no-pub --reporter compact
