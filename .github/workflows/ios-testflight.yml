name: SmartBet iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - feature/api

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Create environment file
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |

          test -n "$FOOTBALL_DATA_API_KEY" || {
            echo "ERRORE: FOOTBALL_DATA_API_KEY mancante"
            exit 1
          }

          printf 'FOOTBALL_DATA_API_KEY=%s\n' "$FOOTBALL_DATA_API_KEY" > .env

          echo "OK: .env creato con entrambe le API key"

      - name: Install Flutter
        run: |
          git clone \
            --depth 1 \
            --branch stable \
            https://github.com/flutter/flutter.git \
            "$HOME/flutter"

          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter setup
        run: |
          export PATH="$HOME/flutter/bin:$PATH"

          flutter --version
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get

      - name: CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Flutter analyze
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter analyze --no-fatal-infos

      - name: Prepare App Store Connect API key
        env:
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          test -n "$APPSTORE_PRIVATE_KEY_BASE64" || {
            echo "ERRORE: APPSTORE_PRIVATE_KEY_BASE64 mancante"
            exit 1
          }

          test -n "$APPSTORE_KEY_ID" || {
            echo "ERRORE: APPSTORE_KEY_ID mancante"
            exit 1
          }

          test -n "$APPSTORE_ISSUER_ID" || {
            echo "ERRORE: APPSTORE_ISSUER_ID mancante"
            exit 1
          }

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"

          printf '%s' "$APPSTORE_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          echo "Verifica chiave privata..."
          openssl pkey -in "$KEY_PATH" -noout
          echo "✅ Chiave P8 ricostruita correttamente"

          echo "OK: credenziali App Store Connect preparate"

      - name: Install iOS signing assets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$IOS_DISTRIBUTION_P12_BASE64" || {
            echo "ERRORE: IOS_DISTRIBUTION_P12_BASE64 mancante"
            exit 1
          }

          test -n "$IOS_DISTRIBUTION_P12_PASSWORD" || {
            echo "ERRORE: IOS_DISTRIBUTION_P12_PASSWORD mancante"
            exit 1
          }

          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || {
            echo "ERRORE: IOS_PROVISIONING_PROFILE_BASE64 mancante"
            exit 1
          }

          CERT_PATH="$RUNNER_TEMP/SmartBet_Distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/SmartBet_App_Store.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/smartbet-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" |
            base64 --decode > "$CERT_PATH"

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" |
            base64 --decode > "$PROFILE_PATH"

          security create-keychain             -p "$KEYCHAIN_PASSWORD"             "$KEYCHAIN_PATH"

          security set-keychain-settings             -lut 21600             "$KEYCHAIN_PATH"

          security unlock-keychain             -p "$KEYCHAIN_PASSWORD"             "$KEYCHAIN_PATH"

          security import "$CERT_PATH"             -k "$KEYCHAIN_PATH"             -P "$IOS_DISTRIBUTION_P12_PASSWORD"             -T /usr/bin/codesign             -T /usr/bin/security

          security set-key-partition-list             -S apple-tool:,apple:,codesign:             -s             -k "$KEYCHAIN_PASSWORD"             "$KEYCHAIN_PATH"

          security list-keychains             -d user             -s "$KEYCHAIN_PATH"

          security default-keychain             -s "$KEYCHAIN_PATH"

          mkdir -p             "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_UUID="$(
            security cms -D -i "$PROFILE_PATH" |
            plutil -extract UUID raw -
          )"

          PROFILE_NAME="$(
            security cms -D -i "$PROFILE_PATH" |
            plutil -extract Name raw -
          )"

          cp "$PROFILE_PATH"             "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Provisioning profile: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"

          echo "=== IDENTITA DI FIRMA ==="
          security find-identity             -v             -p codesigning             "$KEYCHAIN_PATH"

      - name: Configure Runner signing
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')

          target = project.targets.find { |t| t.name == 'Runner' }
          abort 'ERRORE: target Runner non trovato' unless target

          config = target.build_configurations.find { |c| c.name == 'Release' }
          abort 'ERRORE: configurazione Release non trovata' unless config

          config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
          config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
          config.build_settings['DEVELOPMENT_TEAM'] = '69GF6US7CB'
          config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = 'SmartBet App Store'

          project.save

          puts 'OK: firma manuale configurata solo per Runner/Release'
          RUBY

      - name: Archive SmartBet for App Store
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          export PATH="$HOME/flutter/bin:$PATH"

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"

          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SmartBet.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            FLUTTER_BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Create App Store export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>destination</key>
              <string>upload</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>69GF6US7CB</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.michelebarberi.smartbetai</key>
                  <string>SmartBet App Store</string>
              </dict>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload SmartBet to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"

          mkdir -p "$RUNNER_TEMP/AppStoreExport"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SmartBet.xcarchive" \
            -exportPath "$RUNNER_TEMP/AppStoreExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Save Xcode archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartBet-xcarchive-${{ github.run_number }}
          path: ${{ runner.temp }}/SmartBet.xcarchive
          if-no-files-found: ignore
