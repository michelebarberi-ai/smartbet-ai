name: SmartBet iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - feature/api
      - feature/v1.2.4-simulation
      # The release branch is created only once final gates are approved.
      # Preparing this workflow on feature branch does NOT publish TestFlight.
      - release/b45-testflight
      - release/b47-testflight
      - release/b48-testflight
      - release/b49-testflight
      - release/b59-testflight
      - release/b60-testflight
      - release/b61-testflight
      - release/b62-testflight
      - release/b63-testflight
      - release/b64-testflight
      - release/b65-testflight
      - release/b66-testflight
      - release/b67-testflight
      - release/b68-testflight
      - release/b69-testflight
      - release/b70-testflight
      - release/b71-testflight
      - release/b73-testflight
      - release/b74-testflight
      - release/b75-testflight

jobs:
  build-ios:
    # The B45 release branch may be created before the authorization commit.
    # Start exactly one B45 upload only for the deliberate release commit.
    # Preserve legacy branches and allow a manual workflow dispatch if needed.
    if: >-
      (github.ref != 'refs/heads/release/b45-testflight' &&
       github.ref != 'refs/heads/release/b47-testflight' &&
       github.ref != 'refs/heads/release/b48-testflight' &&
       github.ref != 'refs/heads/release/b49-testflight' &&
       github.ref != 'refs/heads/release/b59-testflight' &&
       github.ref != 'refs/heads/release/b60-testflight' &&
       github.ref != 'refs/heads/release/b61-testflight' &&
       github.ref != 'refs/heads/release/b62-testflight' &&
       github.ref != 'refs/heads/release/b63-testflight' &&
       github.ref != 'refs/heads/release/b64-testflight' &&
       github.ref != 'refs/heads/release/b65-testflight' &&
       github.ref != 'refs/heads/release/b66-testflight' &&
       github.ref != 'refs/heads/release/b67-testflight' &&
       github.ref != 'refs/heads/release/b68-testflight' &&
       github.ref != 'refs/heads/release/b69-testflight' &&
       github.ref != 'refs/heads/release/b70-testflight' &&
       github.ref != 'refs/heads/release/b71-testflight' &&
       github.ref != 'refs/heads/release/b73-testflight' &&
       github.ref != 'refs/heads/release/b74-testflight' &&
       github.ref != 'refs/heads/release/b75-testflight') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref != 'refs/heads/release/b47-testflight' &&
       github.ref != 'refs/heads/release/b48-testflight' &&
       github.ref != 'refs/heads/release/b49-testflight' &&
       github.ref != 'refs/heads/release/b59-testflight' &&
       github.ref != 'refs/heads/release/b60-testflight' &&
       github.ref != 'refs/heads/release/b61-testflight' &&
       github.ref != 'refs/heads/release/b62-testflight' &&
       github.ref != 'refs/heads/release/b63-testflight' &&
       github.ref != 'refs/heads/release/b64-testflight' &&
       github.ref != 'refs/heads/release/b65-testflight' &&
       github.ref != 'refs/heads/release/b66-testflight' &&
       github.ref != 'refs/heads/release/b67-testflight' &&
       github.ref != 'refs/heads/release/b68-testflight' &&
       github.ref != 'refs/heads/release/b69-testflight' &&
       github.ref != 'refs/heads/release/b70-testflight' &&
       github.ref != 'refs/heads/release/b71-testflight' &&
       github.ref != 'refs/heads/release/b73-testflight' &&
       github.ref != 'refs/heads/release/b74-testflight' &&
       github.ref != 'refs/heads/release/b75-testflight') ||
      (github.event_name == 'push' &&
       ((github.ref == 'refs/heads/release/b45-testflight' &&
         github.event.head_commit.message == 'release(build45): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b47-testflight' &&
         github.event.head_commit.message == 'release(build47): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b48-testflight' &&
         github.event.head_commit.message == 'release(build48): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b49-testflight' &&
         github.event.head_commit.message == 'release(build49): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b59-testflight' &&
         github.event.head_commit.message == 'release(build59): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b60-testflight' &&
         github.event.head_commit.message == 'release(build60): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b61-testflight' &&
         github.event.head_commit.message == 'release(build61): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b62-testflight' &&
         github.event.head_commit.message == 'release(build62): authorize TestFlight upload') ||
         (github.ref == 'refs/heads/release/b63-testflight' &&
          github.event.head_commit.message == 'release(build63): authorize TestFlight upload') ||
         (github.ref == 'refs/heads/release/b64-testflight' &&
          github.event.head_commit.message == 'release(build64): authorize TestFlight upload') ||
         (github.ref == 'refs/heads/release/b65-testflight' &&
          github.event.head_commit.message == 'release(build65): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b66-testflight' &&
         github.event.head_commit.message == 'release(build66): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b67-testflight' &&
         github.event.head_commit.message == 'release(build67): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b68-testflight' &&
         github.event.head_commit.message == 'release(build68): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b69-testflight' &&
         github.event.head_commit.message == 'release(build69): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b70-testflight' &&
         github.event.head_commit.message == 'release(build70): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b71-testflight' &&
         github.event.head_commit.message == 'release(build71): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b73-testflight' &&
         github.event.head_commit.message == 'release(build73): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b74-testflight' &&
         github.event.head_commit.message == 'release(build74): authorize TestFlight upload') ||
        (github.ref == 'refs/heads/release/b75-testflight' &&
         github.event.head_commit.message == 'release(build75): authorize TestFlight upload')))
    runs-on: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Create environment file
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |

          test -n "$FOOTBALL_DATA_API_KEY" || {
            echo "ERRORE: FOOTBALL_DATA_API_KEY mancante"
            exit 1
          }

          printf 'FOOTBALL_DATA_API_KEY=%s\n' "$FOOTBALL_DATA_API_KEY" > .env

          echo "OK: .env creato con entrambe le API key"

      - name: Install Flutter
        run: |
          git clone \
            --depth 1 \
            --branch stable \
            https://github.com/flutter/flutter.git \
            "$HOME/flutter"

          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter setup
        run: |
          export PATH="$HOME/flutter/bin:$PATH"

          flutter --version
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get

      - name: CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: B63/B64/B65/B66/B67/B68/B69/B70/B71/B73 backend syntax preflight
        if: >-
          github.ref == 'refs/heads/release/b63-testflight' ||
          github.ref == 'refs/heads/release/b64-testflight' ||
          github.ref == 'refs/heads/release/b65-testflight' ||
          github.ref == 'refs/heads/release/b66-testflight' ||
          github.ref == 'refs/heads/release/b67-testflight' ||
          github.ref == 'refs/heads/release/b68-testflight' ||
          github.ref == 'refs/heads/release/b69-testflight' ||
          github.ref == 'refs/heads/release/b70-testflight' ||
          github.ref == 'refs/heads/release/b71-testflight' ||
          github.ref == 'refs/heads/release/b73-testflight' ||
          github.ref == 'refs/heads/release/b74-testflight' ||
          github.ref == 'refs/heads/release/b75-testflight'
        run: |
          node --check backend/server.js
          node --check backend/auto_coupon/background_worker.js

      # B64: run the backend regression before preparing signing assets.
      - name: B64/B65/B66/B67/B68/B69/B70/B71/B73 full backend regression before signing
        if: >-
          github.ref == 'refs/heads/release/b64-testflight' ||
          github.ref == 'refs/heads/release/b65-testflight' ||
          github.ref == 'refs/heads/release/b66-testflight' ||
          github.ref == 'refs/heads/release/b67-testflight' ||
          github.ref == 'refs/heads/release/b68-testflight' ||
          github.ref == 'refs/heads/release/b69-testflight' ||
          github.ref == 'refs/heads/release/b70-testflight' ||
          github.ref == 'refs/heads/release/b71-testflight' ||
          github.ref == 'refs/heads/release/b73-testflight' ||
          github.ref == 'refs/heads/release/b74-testflight' ||
          github.ref == 'refs/heads/release/b75-testflight'
        run: |
          npm --prefix backend ci --no-audit --no-fund
          npm --prefix backend test

      - name: Flutter analyze
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter analyze --no-fatal-infos

      # Before any signing/export, reject a release with broken remote iPhone workflow.
      - name: B47/B48/B49 remote coupon release regression
        if: >-
          github.ref == 'refs/heads/release/b47-testflight' ||
          github.ref == 'refs/heads/release/b48-testflight' ||
          github.ref == 'refs/heads/release/b49-testflight'
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter test --no-pub --reporter compact \
            test/services/goalvdline_on_demand_coupon_client_test.dart \
            test/widgets/goalvdline_on_demand_coupon_panel_test.dart \
            test/services/goalvdline_three_coupon_system_test.dart \
            test/services/goalvdline_official_coupon_contract_test.dart \
            test/widgets/goalvdline_requested_coupon_ready_screen_test.dart

      - name: B59 owner login, QuoteLab, public UI and simulation regression
        if: github.ref == 'refs/heads/release/b59-testflight'
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter test --no-pub --reporter compact \
            test/services/goalvdline_owner_session_client_test.dart \
            test/services/goalvdline_b57_public_private_consensus_test.dart \
            test/services/quotelab_historical_service_test.dart \
            test/services/goalvdline_minute_replay_service_test.dart

      - name: B60 Diego youth/national data validation
        if: github.ref == 'refs/heads/release/b60-testflight'
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter test --no-pub --reporter compact \
            test/services/goalvdline_b60_diego_data_readiness_test.dart \
            test/services/goalvdline_b60_data_source_coverage_test.dart \
            test/services/diego_ai_odds_blind_test.dart \
            test/services/dual_engine_summary_preview_test.dart

      - name: B61 owner enrollment privacy, email and TOTP tests
        if: github.ref == 'refs/heads/release/b61-testflight'
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter test --no-pub --reporter compact \
            test/services/goalvdline_b61_owner_setup_test.dart \
            test/services/goalvdline_owner_session_client_test.dart \
            test/services/goalvdline_b57_public_private_consensus_test.dart

      # B62: run full regression before preparing signing credentials.
      - name: B62/B63/B64/B65/B66/B67/B68/B69/B70/B71/B73 full Flutter regression before signing
        if: >-
          github.ref == 'refs/heads/release/b62-testflight' ||
          github.ref == 'refs/heads/release/b63-testflight' ||
          github.ref == 'refs/heads/release/b64-testflight' ||
          github.ref == 'refs/heads/release/b65-testflight' ||
          github.ref == 'refs/heads/release/b66-testflight' ||
          github.ref == 'refs/heads/release/b67-testflight' ||
          github.ref == 'refs/heads/release/b68-testflight' ||
          github.ref == 'refs/heads/release/b69-testflight' ||
          github.ref == 'refs/heads/release/b70-testflight' ||
          github.ref == 'refs/heads/release/b71-testflight' ||
          github.ref == 'refs/heads/release/b73-testflight' ||
          github.ref == 'refs/heads/release/b74-testflight' ||
          github.ref == 'refs/heads/release/b75-testflight'
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter test --no-pub --reporter compact

      - name: Prepare App Store Connect API key
        env:
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          test -n "$APPSTORE_PRIVATE_KEY_BASE64" || {
            echo "ERRORE: APPSTORE_PRIVATE_KEY_BASE64 mancante"
            exit 1
          }

          test -n "$APPSTORE_KEY_ID" || {
            echo "ERRORE: APPSTORE_KEY_ID mancante"
            exit 1
          }

          test -n "$APPSTORE_ISSUER_ID" || {
            echo "ERRORE: APPSTORE_ISSUER_ID mancante"
            exit 1
          }

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"

          printf '%s' "$APPSTORE_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          echo "Verifica chiave privata..."
          openssl pkey -in "$KEY_PATH" -noout
          echo "✅ Chiave P8 ricostruita correttamente"

          echo "OK: credenziali App Store Connect preparate"

      - name: Install iOS signing assets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$IOS_DISTRIBUTION_P12_BASE64" || {
            echo "ERRORE: IOS_DISTRIBUTION_P12_BASE64 mancante"
            exit 1
          }

          test -n "$IOS_DISTRIBUTION_P12_PASSWORD" || {
            echo "ERRORE: IOS_DISTRIBUTION_P12_PASSWORD mancante"
            exit 1
          }

          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || {
            echo "ERRORE: IOS_PROVISIONING_PROFILE_BASE64 mancante"
            exit 1
          }

          CERT_PATH="$RUNNER_TEMP/SmartBet_Distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/SmartBet_App_Store.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/smartbet-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" |
            base64 --decode > "$CERT_PATH"

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" |
            base64 --decode > "$PROFILE_PATH"

          security create-keychain             -p "$KEYCHAIN_PASSWORD"             "$KEYCHAIN_PATH"

          security set-keychain-settings             -lut 21600             "$KEYCHAIN_PATH"

          security unlock-keychain             -p "$KEYCHAIN_PASSWORD"             "$KEYCHAIN_PATH"

          security import "$CERT_PATH"             -k "$KEYCHAIN_PATH"             -P "$IOS_DISTRIBUTION_P12_PASSWORD"             -T /usr/bin/codesign             -T /usr/bin/security

          security set-key-partition-list             -S apple-tool:,apple:,codesign:             -s             -k "$KEYCHAIN_PASSWORD"             "$KEYCHAIN_PATH"

          security list-keychains             -d user             -s "$KEYCHAIN_PATH"

          security default-keychain             -s "$KEYCHAIN_PATH"

          mkdir -p             "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_UUID="$(
            security cms -D -i "$PROFILE_PATH" |
            plutil -extract UUID raw -
          )"

          PROFILE_NAME="$(
            security cms -D -i "$PROFILE_PATH" |
            plutil -extract Name raw -
          )"

          cp "$PROFILE_PATH"             "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Provisioning profile: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"

          # B73: a notification permission prompt alone is NOT APNs.
          # Reject the old Store profile, which lacks aps-environment.
          if [[ "$GITHUB_REF" == "refs/heads/release/b73-testflight" || "$GITHUB_REF" == "refs/heads/release/b74-testflight" || "$GITHUB_REF" == "refs/heads/release/b75-testflight" ]]; then
            APNS_ENTITLEMENT="$(security cms -D -i "$PROFILE_PATH" |
              plutil -extract Entitlements.aps-environment raw - 2>/dev/null || true)"
            if [[ "$APNS_ENTITLEMENT" != "production" ]]; then
              echo "ERRORE: il profilo App Store non include aps-environment=production."
              echo "Abilitare Push Notifications per il Bundle ID Apple e"
              echo "rigenerare il profilo App Store prima della Build 73."
              exit 1
            fi
            echo "APNs production entitlement verificato nel profilo di distribuzione."
          fi

          echo "=== IDENTITA DI FIRMA ==="
          security find-identity             -v             -p codesigning             "$KEYCHAIN_PATH"

      - name: Configure Runner signing
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')

          target = project.targets.find { |t| t.name == 'Runner' }
          abort 'ERRORE: target Runner non trovato' unless target

          config = target.build_configurations.find { |c| c.name == 'Release' }
          abort 'ERRORE: configurazione Release non trovata' unless config

          config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
          config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
          config.build_settings['DEVELOPMENT_TEAM'] = '69GF6US7CB'
          config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = 'SmartBet App Store'

          project.save

          puts 'OK: firma manuale configurata solo per Runner/Release'
          RUBY

      - name: Archive SmartBet for App Store
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          export PATH="$HOME/flutter/bin:$PATH"

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"

          # Pin Build 45 on the isolated release branch. Other existing
          # workflow branches retain their previous build numbering.
          if [[ "$GITHUB_REF" == "refs/heads/release/b45-testflight" ]]; then
            grep -qx 'version: 1.2.5+45' pubspec.yaml || {
              echo "ERROR: Build 45 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="45"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b47-testflight" ]]; then
            grep -qx 'version: 1.2.5+47' pubspec.yaml || {
              echo "ERROR: Build 47 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="47"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b48-testflight" ]]; then
            grep -qx 'version: 1.2.5+48' pubspec.yaml || {
              echo "ERROR: Build 48 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="48"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b49-testflight" ]]; then
            grep -qx 'version: 1.2.5+49' pubspec.yaml || {
              echo "ERROR: Build 49 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="49"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b59-testflight" ]]; then
            grep -qx 'version: 1.2.5+59' pubspec.yaml || {
              echo "ERROR: Build 59 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="59"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b60-testflight" ]]; then
            grep -qx 'version: 1.2.5+60' pubspec.yaml || {
              echo "ERROR: Build 60 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="60"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b61-testflight" ]]; then
            grep -qx 'version: 1.2.5+61' pubspec.yaml || {
              echo "ERROR: Build 61 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="61"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b62-testflight" ]]; then
            grep -qx 'version: 1.2.5+62' pubspec.yaml || {
              echo "ERROR: Build 62 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="62"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b63-testflight" ]]; then
            grep -qx 'version: 1.2.5+63' pubspec.yaml || {
              echo "ERROR: Build 63 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="63"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b64-testflight" ]]; then
            grep -qx 'version: 1.2.5+64' pubspec.yaml || {
              echo "ERROR: Build 64 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="64"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b65-testflight" ]]; then
            grep -qx 'version: 1.2.5+65' pubspec.yaml || {
              echo "ERROR: Build 65 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="65"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b66-testflight" ]]; then
            grep -qx 'version: 1.2.5+66' pubspec.yaml || {
              echo "ERROR: Build 66 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="66"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b67-testflight" ]]; then
            grep -qx 'version: 1.2.5+67' pubspec.yaml || {
              echo "ERROR: Build 67 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="67"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b68-testflight" ]]; then
            grep -qx 'version: 1.2.5+68' pubspec.yaml || {
              echo "ERROR: Build 68 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="68"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b69-testflight" ]]; then
            grep -qx 'version: 1.2.5+69' pubspec.yaml || {
              echo "ERROR: Build 69 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="69"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b70-testflight" ]]; then
            grep -qx 'version: 1.2.5+70' pubspec.yaml || {
              echo "ERROR: Build 70 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="70"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b71-testflight" ]]; then
            grep -qx 'version: 1.2.5+71' pubspec.yaml || {
              echo "ERROR: Build 71 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="71"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b73-testflight" ]]; then
            grep -qx 'version: 1.2.5+73' pubspec.yaml || {
              echo "ERROR: Build 73 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="73"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b74-testflight" ]]; then
            grep -qx 'version: 1.2.5+74' pubspec.yaml || {
              echo "ERROR: Build 74 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="74"
          elif [[ "$GITHUB_REF" == "refs/heads/release/b75-testflight" ]]; then
            grep -qx 'version: 1.2.5+75' pubspec.yaml || {
              echo "ERROR: Build 75 release version mismatch"
              exit 1
            }
            BUILD_NUMBER="75"
          else
            BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          fi

          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SmartBet.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            FLUTTER_BUILD_NUMBER="$BUILD_NUMBER"

      - name: Create App Store export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>destination</key>
              <string>upload</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>69GF6US7CB</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.michelebarberi.smartbetai</key>
                  <string>SmartBet App Store</string>
              </dict>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload SmartBet to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"

          mkdir -p "$RUNNER_TEMP/AppStoreExport"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SmartBet.xcarchive" \
            -exportPath "$RUNNER_TEMP/AppStoreExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Save Xcode archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartBet-xcarchive-${{ github.run_number }}
          path: ${{ runner.temp }}/SmartBet.xcarchive
          if-no-files-found: ignore
