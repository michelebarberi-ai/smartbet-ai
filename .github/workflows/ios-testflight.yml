name: SmartBet iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/api

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Flutter
        run: |
          git clone \
            --depth 1 \
            --branch stable \
            https://github.com/flutter/flutter.git \
            "$HOME/flutter"

          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter setup
        run: |
          export PATH="$HOME/flutter/bin:$PATH"

          flutter --version
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get

      - name: CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Flutter analyze
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter analyze

      - name: Build unsigned iOS archive
        run: |
          export PATH="$HOME/flutter/bin:$PATH"

          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SmartBet.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartBet-xcarchive
          path: ${{ runner.temp }}/SmartBet.xcarchive
