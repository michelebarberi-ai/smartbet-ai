name: SmartBet B47 corrections QA

# Code validation ONLY: never signs, archives or uploads to Apple.
on:
  push:
    branches:
      - feature/b47-corrections

permissions:
  contents: read

concurrency:
  group: smartbet-b47-corrections-qa
  cancel-in-progress: true

jobs:
  qa-flutter:
    if: github.ref == 'refs/heads/feature/b47-corrections'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Fetch dependencies
        shell: bash
        run: |
          flutter --version
          flutter pub get

      - name: Analyze Flutter code
        shell: bash
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test bookmaker coverage, quote policy, safe coupon limits and OR markets
        shell: bash
        run: |
          flutter test --no-pub --reporter compact \
            test/services/sisal_odds_service_coverage_test.dart \
            test/services/goalvdline_quote_policy_test.dart \
            test/services/smartbet_sports_market_selector_test.dart \
            test/services/smartbet_multi_market_selection_service_test.dart \
            test/services/smartbet_or_markets_test.dart \
            test/services/goalvdline_multi_bookmaker_odds_test.dart \
            test/services/goalvdline_on_demand_coupon_client_test.dart \
            test/widgets/goalvdline_on_demand_coupon_panel_test.dart \
            test/services/goalvdline_coupon_ready_notifier_test.dart \
            test/services/goalvdline_market_probability_filter_test.dart \
            test/services/goalvdline_three_coupon_system_test.dart \
            test/services/goalvdline_official_coupon_contract_test.dart

  qa-all-flutter-tests:
    needs: qa-flutter
    if: github.ref == 'refs/heads/feature/b47-corrections'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Full Flutter regression suite
        shell: bash
        run: |
          flutter pub get
          flutter test --no-pub --reporter compact

  qa-on-demand-backend:
    if: github.ref == 'refs/heads/feature/b47-corrections'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate on-demand service syntax
        run: |
          node --check backend/auto_coupon/on_demand_coupon_service.js
          node --check backend/auto_coupon/on_demand_coupon_routes.js
          node --check backend/auto_coupon/on_demand_scheduler.js
          node --check backend/learning_only_server.js
          node --check backend/learning/learning_repository.js
          node --check backend/learning/learning_routes.js
      - name: On-demand authentication, official engine, durability tests
        run: |
          node --test \
            backend/test/auto_coupon_on_demand.test.js \
            backend/test/auto_coupon_on_demand_scheduler.test.js \
            backend/test/auto_coupon_generation_coordinator.test.js \
            backend/test/auto_coupon_worker_route.test.js

  qa-on-demand-postgres:
    # Ephemeral CI database only; never connects to live Neon.
    if: github.ref == 'refs/heads/feature/b47-corrections'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goalvdline_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: goalvdline_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goalvdline_ci -d goalvdline_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ON_DEMAND_TEST_DATABASE_URL: postgres://goalvdline_ci:ephemeral_ci_only@127.0.0.1:5432/goalvdline_ci
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm ci --prefix backend --ignore-scripts --omit=dev
      - name: Verify real PostgreSQL schema and worker leases
        run: node --test backend/test/on_demand_postgres_integration.test.js

  qa-ios-compile:
    # Validate the Swift notification test handler without any signing or upload.
    needs: qa-flutter
    if: github.ref == 'refs/heads/feature/b47-corrections'
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter dependencies and pods
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get
          cd ios && pod install

      - name: Compile iOS without code signing
        run: flutter build ios --no-codesign

qa-render-neon-readiness:
    # Read-only smoke check, no credentials or database writes.
    if: github.ref == 'refs/heads/feature/b47-corrections'
    needs: qa-on-demand-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Check Render-to-Neon baseline readiness
        shell: bash
        env:
          HEALTH_URL: https://goalvdline-learning-api.onrender.com/health/database
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/b47-db-health.json"
          for attempt in 1 2; do
            status="$(curl --silent --show-error \
              --connect-timeout 15 --max-time 120 --max-redirs 0 \
              --output "$response_file" --write-out '%{http_code}' \
              "$HEALTH_URL")" || status="000"
            if [[ "$status" == "200" ]] && \
              node -e '
                const fs = require("node:fs");
                const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                if (payload.databaseChecked !== true ||
                    payload.databaseReachable !== true ||
                    payload.schemaReady !== true ||
                    payload.learningEnabled !== false) process.exit(1);
              ' "$response_file"; then
              echo "PASS: Render-to-Neon baseline reachable and schema ready."
              echo "Note: this does NOT certify B47 worker, coupons, or production release."
              exit 0
            fi
            echo "Render-Neon health not ready (attempt $attempt, HTTP $status)."
            if [[ "$attempt" == "1" ]]; then sleep 15; fi
          done
          echo "ERROR: Cannot certify Render-to-Neon connectivity."
          exit 1
