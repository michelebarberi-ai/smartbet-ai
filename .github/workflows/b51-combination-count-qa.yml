name: GoalVdLine B51 partial-results QA

# Read-only checks. No TestFlight upload, signing, deployment or paid infrastructure.
on:
  push:
    branches:
      - fix/b51-combination-count-clarity

permissions:
  contents: read

jobs:
  flutter-b51-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run Flutter regression suite
        run: flutter test --no-pub --reporter compact
