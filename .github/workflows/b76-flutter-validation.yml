name: B76 Flutter validation

on:
  pull_request:
    branches: [release/b75-testflight]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/b76-flutter-validation.yml'
  workflow_dispatch:

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze changed application
        run: dart analyze lib/services/personal_coupon_store.dart lib/screens/personal_coupons_screen.dart lib/widgets/add_to_personal_coupon_button.dart lib/widgets/menu_grid.dart
      - name: Run personal coupon tests
        run: flutter test test/services/personal_coupon_store_test.dart
