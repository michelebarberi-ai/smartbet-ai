name: GoalVdLine B50 three-coupon presentation QA

# Isolated read-only validation; no signing, deployment, or paid resources.
on:
  push:
    branches:
      - fix/b50-three-coupon-visual

permissions:
  contents: read

jobs:
  flutter-b50-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout changes
        uses: actions/checkout@v4
      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: flutter pub get
      - name: Validate analysis
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run B50 three-coupon viewer and existing regressions
        run: |
          flutter test --no-pub --reporter compact \
            test/services/dual_engine_sports_comparison_test.dart \
            test/services/dual_engine_summary_preview_test.dart \
            test/services/smartbet_sports_audit_status_test.dart \
            test/services/smartbet_match_simulation_service_test.dart \
            test/services/smartbet_simulation_audit_service_test.dart \
            test/services/smartbet_multimarket_ranking_service_test.dart \
            test/services/smartbet_or_markets_test.dart \
            test/services/smartbet_local_auditor_threshold_test.dart \
            test/services/smartbet_league_market_reliability_service_test.dart \
            test/services/goalvdline_competition_order_test.dart \
            test/services/goalvdline_coupon_ready_notifier_test.dart \
            test/widgets/goalvdline_three_coupon_viewer_test.dart

  flutter-full-regression:
    name: Full Flutter regression (no deployment)
    needs: flutter-b50-qa
    if: github.ref == 'refs/heads/fix/b50-three-coupon-visual'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: flutter pub get
      - name: Run every Flutter test
        run: flutter test --no-pub --reporter compact

  ios-compile-check:
    name: iOS compilation without signing or upload
    needs: flutter-full-regression
    if: github.ref == 'refs/heads/fix/b50-three-coupon-visual'
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - name: Checkout isolated fixes branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce no release and no committed secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/b50-three-coupon-visual'
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Refusing build with tracked .env"
            exit 1
          fi
          echo "Source commit: $(git rev-parse --short=12 HEAD)"
      - name: Select installed Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare Flutter iOS dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get
      - name: Install iOS pods
        run: |
          cd ios
          pod install
      - name: Compile iOS without code signing
        run: flutter build ios --no-codesign
