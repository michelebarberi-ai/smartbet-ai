name: GoalVdLine B57 public and internal learning UI QA

# No signing, deployment, DB migration or scheduled collection.
on:
  push:
    branches:
      - feature/b57-public-private-learning-ui

permissions:
  contents: read

jobs:
  b57-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Public UI and external consensus tests
        run: flutter test --no-pub --reporter compact test/services/goalvdline_b57_public_private_consensus_test.dart
      - name: Full regression
        run: flutter test --no-pub --reporter compact
