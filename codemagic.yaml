workflows:
  smartbet-ios-release:
    name: SmartBet AI - iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: smartbet-appstore

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.michelebarberi.smartbetai

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Configure iOS signing
        script: xcode-project use-profiles

      - name: Verify release version
        script: |
          grep "^version:" pubspec.yaml
          flutter --version
          xcodebuild -version

      - name: Build SmartBet IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=10 \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
